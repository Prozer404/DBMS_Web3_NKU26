<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Web3 交易所 · 用户端</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="overlay" aria-modal="true" role="dialog">
    <div class="modal-box">
      <h2>登录 / 注册</h2>
      <div class="modal-tabs">
        <button type="button" id="tabLogin" class="active">登录</button>
        <button type="button" id="tabReg">注册</button>
      </div>
      <form id="formLogin" class="modal-form">
        <div class="form-row"><label>邮箱</label><input type="email" id="loginEmail" required autocomplete="username" /></div>
        <div class="form-row"><label>密码</label><input type="password" id="loginPass" required autocomplete="current-password" /></div>
        <div class="modal-actions">
          <button type="button" class="ghost" id="btnModalClose">稍后再说</button>
          <button type="submit" class="primary">登录</button>
        </div>
      </form>
      <form id="formReg" class="modal-form" style="display:none">
        <div class="form-row"><label>邮箱</label><input type="email" id="regEmail" required autocomplete="email" /></div>
        <div class="form-row"><label>密码（至少 6 位）</label><input type="password" id="regPass" minlength="6" required autocomplete="new-password" /></div>
        <div class="modal-actions">
          <button type="button" class="ghost" id="btnModalClose2">稍后再说</button>
          <button type="submit" class="primary">注册并登录</button>
        </div>
      </form>
    </div>
  </div>

  <header>
    <h1>Web3 交易所</h1>
    <span class="sub">用户端 · 数据经 API 读写数据库</span>
    <div id="userBar">
      <span id="userInfo" class="muted">未登录</span>
      <button type="button" id="btnOpenAuth" class="primary">登录 / 注册</button>
      <button type="button" id="btnLogout" style="display:none">退出</button>
      <a href="/admin/" target="_blank" rel="noopener">管理后台</a>
    </div>
  </header>
  <nav id="nav">
    <button type="button" data-tab="home" class="active">概览</button>
    <button type="button" data-tab="pairs">行情</button>
    <button type="button" data-tab="assets">资产</button>
    <button type="button" data-tab="ledger">流水</button>
    <button type="button" data-tab="orders">订单</button>
    <button type="button" data-tab="trades">成交</button>
    <button type="button" data-tab="deposits">充值</button>
    <button type="button" data-tab="withdrawals">提现</button>
    <button type="button" data-tab="kyc">KYC</button>
  </nav>
  <main>
    <section id="panel-home" class="panel active">
      <div class="card">
        <h2>欢迎</h2>
        <p>请先通过右上角弹窗<strong>登录或注册</strong>。演示库中种子用户的密码哈希为占位符，若无法登录请<strong>注册新邮箱</strong>。</p>
        <p class="muted">KYC：0未认证 · 1审核中 · 2已通过 · 3已拒绝 · 订单状态：0待成交 · 1部分成交 · 2完全成交 · 3已撤销</p>
      </div>
    </section>
    <section id="panel-pairs" class="panel">
      <h2>交易对（公开）</h2>
      <div class="toolbar"><button type="button" id="btnLoadPairs">刷新</button></div>
      <div id="wrapPairs" class="card"></div>
    </section>
    <section id="panel-assets" class="panel">
      <h2>我的资产</h2>
      <div class="toolbar"><button type="button" id="btnLoadAssets">刷新</button></div>
      <div id="wrapAssets" class="card"></div>
    </section>
    <section id="panel-ledger" class="panel">
      <h2>资金流水</h2>
      <div class="toolbar"><button type="button" id="btnLoadLedger">刷新</button></div>
      <div id="wrapLedger" class="card"></div>
    </section>
    <section id="panel-orders" class="panel">
      <h2>下单</h2>
      <div class="card">
        <div class="toolbar">
          <label>交易对 ID <select id="ordPair"></select></label>
          <label>方向 <select id="ordSide"><option value="1">1 买入</option><option value="2">2 卖出</option></select></label>
          <label>类型 <select id="ordType"><option value="1">1 限价</option><option value="2">2 市价</option></select></label>
          <label>价格 <input id="ordPrice" placeholder="市价可 0" value="0" /></label>
          <label>数量 <input id="ordAmt" placeholder="如 0.01" /></label>
          <button type="button" class="primary" id="btnPlaceOrder">提交订单</button>
        </div>
      </div>
      <h2>我的订单</h2>
      <div class="toolbar"><button type="button" id="btnLoadOrders">刷新</button></div>
      <div id="wrapOrders" class="card"></div>
    </section>
    <section id="panel-trades" class="panel">
      <h2>与我相关的成交</h2>
      <div class="toolbar"><button type="button" id="btnLoadTrades">刷新</button></div>
      <div id="wrapTrades" class="card"></div>
    </section>
    <section id="panel-deposits" class="panel">
      <h2>申请充值</h2>
      <div class="card">
        <div class="toolbar">
          <label>币种 <input id="depCcy" maxlength="10" placeholder="USDT" /></label>
          <label>金额 <input id="depAmt" /></label>
          <label>tx_hash（可选）<input id="depHash" style="min-width:14rem" /></label>
          <button type="button" class="primary" id="btnDepSubmit">提交</button>
        </div>
      </div>
      <h2>充值记录</h2>
      <div class="toolbar"><button type="button" id="btnLoadDeps">刷新</button></div>
      <div id="wrapDeps" class="card"></div>
    </section>
    <section id="panel-withdrawals" class="panel">
      <h2>申请提现</h2>
      <div class="card">
        <div class="toolbar">
          <label>币种 <input id="wdCcy" maxlength="10" /></label>
          <label>地址 <input id="wdAddr" style="min-width:18rem" /></label>
          <label>金额 <input id="wdAmt" /></label>
          <button type="button" class="primary" id="btnWdSubmit">提交</button>
        </div>
      </div>
      <h2>提现记录</h2>
      <div class="toolbar"><button type="button" id="btnLoadWds">刷新</button></div>
      <div id="wrapWds" class="card"></div>
    </section>
    <section id="panel-kyc" class="panel">
      <h2>提交 KYC（审核中）</h2>
      <div class="card">
        <div class="toolbar">
          <label>真实姓名 <input id="kycName" /></label>
          <label>证件号 <input id="kycId" /></label>
          <label>证件 URL（可选）<input id="kycUrl" style="min-width:16rem" /></label>
          <button type="button" class="primary" id="btnKycSubmit">提交</button>
        </div>
      </div>
    </section>
  </main>
  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
