<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Web3 管理后台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Web3 交易所 · 管理后台</h1>
    <span class="badge">数据经后端 API 读写 MySQL，浏览器不直连数据库</span>
    <div id="auth-bar">
      <label>管理密钥 <input type="password" id="adminKey" placeholder="与 .env 中 ADMIN_API_KEY 一致" autocomplete="off" /></label>
      <button type="button" class="primary" id="btnSaveKey">保存密钥</button>
      <button type="button" id="btnHealth">检测数据库</button>
    </div>
  </header>
  <div id="status"></div>
  <nav id="tabs">
    <button type="button" data-tab="users" class="active">用户</button>
    <button type="button" data-tab="currencies">币种</button>
    <button type="button" data-tab="pairs">交易对</button>
    <button type="button" data-tab="kyc">KYC</button>
    <button type="button" data-tab="deposits">充值</button>
    <button type="button" data-tab="withdrawals">提现</button>
  </nav>
  <main>
    <section id="panel-users" class="panel active">
      <h2>用户列表 · 改 KYC 状态 / 新增 / 删除</h2>
      <div class="toolbar">
        <button type="button" id="btnLoadUsers">刷新</button>
      </div>
      <div class="toolbar" style="border:1px solid var(--border);padding:0.75rem;border-radius:8px;">
        <strong style="width:100%;margin-bottom:0.25rem;">新增用户（演示：password_hash 请填占位哈希）</strong>
        <label>邮箱 <input id="nu_email" type="email" /></label>
        <label>password_hash <input id="nu_hash" style="width:18rem" placeholder="$2b$12$..." /></label>
        <label>kyc <select id="nu_kyc"><option value="0">0未认证</option><option value="1">1审核中</option><option value="2">2已通过</option><option value="3">3已拒绝</option></select></label>
        <button type="button" class="primary" id="btnCreateUser">创建</button>
      </div>
      <div id="wrap-users"></div>
    </section>
    <section id="panel-currencies" class="panel">
      <h2>币种 · 增删改查</h2>
      <div class="toolbar">
        <button type="button" id="btnLoadCurrencies">刷新</button>
      </div>
      <div class="toolbar" style="border:1px solid var(--border);padding:0.75rem;border-radius:8px;">
        <label>code <input id="cc_code" maxlength="10" /></label>
        <label>name <input id="cc_name" /></label>
        <label>precision <input id="cc_prec" type="number" value="8" min="0" max="18" /></label>
        <label>withdrawal_fee <input id="cc_wf" value="0" /></label>
        <label>min_withdrawal <input id="cc_mw" value="0" /></label>
        <label>is_active <select id="cc_act"><option value="1">1</option><option value="0">0</option></select></label>
        <button type="button" class="primary" id="btnCreateCurrency">新增币种</button>
      </div>
      <div id="wrap-currencies"></div>
    </section>
    <section id="panel-pairs" class="panel">
      <h2>交易对</h2>
      <div class="toolbar">
        <button type="button" id="btnLoadPairs">刷新</button>
      </div>
      <div class="toolbar" style="border:1px solid var(--border);padding:0.75rem;border-radius:8px;">
        <label>base <input id="pc_base" maxlength="10" /></label>
        <label>quote <input id="pc_quote" maxlength="10" /></label>
        <label>min_order_amount <input id="pc_min" value="0.0001" /></label>
        <label>price_precision <input id="pc_pp" type="number" value="2" /></label>
        <label>amount_precision <input id="pc_ap" type="number" value="8" /></label>
        <button type="button" class="primary" id="btnCreatePair">新增交易对</button>
      </div>
      <div id="wrap-pairs"></div>
    </section>
    <section id="panel-kyc" class="panel">
      <h2>KYC 申请 · 更新状态（会同步 users.kyc_status）</h2>
      <div class="toolbar"><button type="button" id="btnLoadKyc">刷新</button></div>
      <div id="wrap-kyc"></div>
    </section>
    <section id="panel-deposits" class="panel">
      <h2>充值记录 · 改状态 / tx_hash</h2>
      <div class="toolbar"><button type="button" id="btnLoadDeposits">刷新</button></div>
      <div id="wrap-deposits"></div>
    </section>
    <section id="panel-withdrawals" class="panel">
      <h2>提现记录 · 改状态</h2>
      <div class="toolbar"><button type="button" id="btnLoadWithdrawals">刷新</button></div>
      <div id="wrap-withdrawals"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
